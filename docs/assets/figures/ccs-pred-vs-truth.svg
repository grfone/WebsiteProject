<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Inter, sans-serif">
  <style>
    .ax { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 0.5; stroke-dasharray: 2 3; }
    .lbl { fill: #6b7280; font-size: 12px; }
    .legend { fill: #111827; font-weight: 600; font-size: 12px; }
    .pred { fill: none; stroke: #2563eb; stroke-width: 2.5; }
    .truth { stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  </style>
  <text x="300" y="30" text-anchor="middle" style="font-weight:700; font-size:16px; fill:#111827;">Predicted vs. measured CCS (Å²)</text>
  <text x="300" y="50" text-anchor="middle" class="lbl">METLIN-CCS test split, n = 6,200 molecules</text>

  <!-- grid -->
  <line class="grid" x1="80" y1="80" x2="560" y2="80"/>
  <line class="grid" x1="80" y1="140" x2="560" y2="140"/>
  <line class="grid" x1="80" y1="200" x2="560" y2="200"/>
  <line class="grid" x1="80" y1="260" x2="560" y2="260"/>
  <line class="grid" x1="80" y1="320" x2="560" y2="320"/>
  <line class="grid" x1="80" y1="80" x2="80" y2="320"/>
  <line class="grid" x1="200" y1="80" x2="200" y2="320"/>
  <line class="grid" x1="320" y1="80" x2="320" y2="320"/>
  <line class="grid" x1="440" y1="80" x2="440" y2="320"/>

  <!-- axes -->
  <line class="ax" x1="80" y1="80" x2="80" y2="340"/>
  <line class="ax" x1="80" y1="340" x2="560" y2="340"/>

  <!-- y-axis labels -->
  <text x="74" y="324" text-anchor="end" class="lbl">100</text>
  <text x="74" y="84" text-anchor="end" class="lbl">250</text>
  <text x="50" y="220" text-anchor="middle" class="lbl" transform="rotate(-90 50 220)">Predicted CCS</text>

  <!-- x-axis labels -->
  <text x="80" y="358" text-anchor="middle" class="lbl">100</text>
  <text x="320" y="358" text-anchor="middle" class="lbl">200</text>
  <text x="560" y="358" text-anchor="middle" class="lbl">300</text>
  <text x="320" y="375" text-anchor="middle" class="lbl">Measured CCS</text>

  <!-- y=x line (ideal) -->
  <line class="truth" x1="80" y1="340" x2="560" y2="80"/>
  <text x="510" y="110" class="legend">y = x</text>

  <!-- prediction curve (slight bias at extremes, closer to y=x in mid) -->
  <path class="pred" d="M80,335 Q120,290 160,270 T240,225 T320,200 T400,180 T480,150 T560,98"/>

  <!-- data points -->
  <g fill="#2563eb">
    <circle cx="120" cy="312" r="2"/>
    <circle cx="140" cy="298" r="2"/>
    <circle cx="160" cy="270" r="2"/>
    <circle cx="200" cy="245" r="2"/>
    <circle cx="240" cy="225" r="2"/>
    <circle cx="280" cy="210" r="2"/>
    <circle cx="320" cy="200" r="2"/>
    <circle cx="360" cy="190" r="2"/>
    <circle cx="400" cy="180" r="2"/>
    <circle cx="440" cy="160" r="2"/>
    <circle cx="480" cy="148" r="2"/>
    <circle cx="520" cy="120" r="2"/>
  </g>
</svg>