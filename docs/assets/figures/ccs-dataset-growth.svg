<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="Inter, sans-serif">
  <style>
    .lbl { fill: #6b7280; font-size: 12px; }
    .num { fill: #111827; font-weight: 700; font-size: 14px; }
    .ax  { stroke: #9ca3af; stroke-width: 1; }
  </style>
  <line class="ax" x1="100" y1="40" x2="100" y2="190"/>
  <line class="ax" x1="100" y1="190" x2="660" y2="190"/>
  <g>
    <rect x="130" y="180" width="80" height="10" fill="#cbd5e1"/>
    <text x="170" y="175" text-anchor="middle" class="num">0.5k</text>
    <text x="170" y="210" text-anchor="middle" class="lbl">Agilent (2012)</text>
  </g>
  <g>
    <rect x="240" y="160" width="80" height="30" fill="#94a3b8"/>
    <text x="280" y="155" text-anchor="middle" class="num">2.4k</text>
