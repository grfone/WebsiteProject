<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRF - Database</title>
    <link rel="icon" type="image/x-icon" href="images/favicon_16_to_1024.ico">
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.283.1.min.js"></script>
</head>

<body class="bg-gray-100 font-sans">
<header class="relative bg-cover bg-center h-64 flex items-center justify-center"
        style="background-image: url('images/banner.jpg')">
    <h1 class="text-6xl font-bold text-white">GRF</h1>
</header>

<nav class="bg-blue-600 text-white p-4">
    <ul class="flex justify-center space-x-8">
        <li><a href="index.html">Home</a></li>
        <li><a href="types_of_clouds.html">Types of Clouds</a></li>
        <li><a href="happy_chat.html">Happy Chat</a></li>
        <li><a href="database.html" class="font-bold">Database</a></li>
    </ul>
</nav>

<main class="max-w-3xl mx-auto my-10 p-6 text-center">

    <!-- Login -->
    <div id="loginBox" class="bg-white shadow-lg rounded-lg p-10">
        <h2 class="text-3xl font-semibold mb-8">Database Login</h2>

        <input id="username" type="text" placeholder="Username or Email"
               class="w-full p-4 border rounded-lg text-lg mb-4">

        <div class="relative mb-6">
            <input id="password" type="password" placeholder="Password"
                   class="w-full p-4 border rounded-lg text-lg pr-12">
            <button type="button" id="togglePassword"
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 hover:text-gray-800">
                <svg id="eyeIcon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path id="eyeIconPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
            </button>
        </div>

        <button id="signInButton"
                class="w-full bg-blue-600 text-white py-4 rounded-lg text-xl hover:bg-blue-700 transition">
            Sign In
        </button>

        <p id="loginError" class="text-red-600 mt-4 text-lg hidden"></p>
    </div>

    <!-- New Password Required (opcional, lo dejamos por si lo usas) -->
    <div id="newPasswordBox" class="hidden bg-white shadow-lg rounded-lg p-10">
        <h2 class="text-3xl font-semibold mb-8">Set New Password</h2>
        <p class="mb-6 text-gray-700">Your account requires a new password before you can continue.</p>

        <input id="newPassword" type="password" placeholder="New Password"
               class="w-full p-4 border rounded-lg text-lg mb-4">
        <input id="confirmPassword" type="password" placeholder="Confirm New Password"
               class="w-full p-4 border rounded-lg text-lg mb-4">

        <button id="setNewPasswordButton"
                class="w-full bg-green-600 text-white py-4 rounded-lg text-xl hover:bg-green-700 transition">
            Set Password & Continue
        </button>

        <p id="newPasswordError" class="text-red-600 mt-4 text-lg hidden"></p>
    </div>

    <div id="databaseForm" class="hidden bg-white shadow-lg rounded-lg p-10 mt-10 text-left">
        <h2 class="text-3xl mb-6 text-center">Important Information</h2>

        <label>User ID (Email)</label>
        <input id="id" disabled class="w-full p-3 border rounded mb-4 bg-gray-100">

        <label>Full Name</label>
        <input id="name" class="w-full p-3 border rounded mb-4">

        <label>Name He/She Likes to Be Called</label>
        <input id="preferred_name" class="w-full p-3 border rounded mb-4">

        <label>Chronic Illnesses & Conditions</label>
        <textarea id="illnesses" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Allergies</label>
        <textarea id="allergies" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Current Medications</label>
        <textarea id="medications" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Place of Birth</label>
        <input id="birth_place" class="w-full p-3 border rounded mb-4">

        <label>Life Milestones & Career</label>
        <textarea id="milestones" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Food Preferences & Dietary Restrictions</label>
        <textarea id="food_preferences" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Hobbies & Interests</label>
        <textarea id="hobbies" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Significant Memories</label>
        <textarea id="memories" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Family Information</label>
        <textarea id="family_info" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Daily Routine Preferences</label>
        <textarea id="routine" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Cultural / Religious Background</label>
        <textarea id="cultural_background" class="w-full p-3 border rounded mb-4"></textarea>

        <label>Your Name as Known by the Elder</label>
        <input id="known_name" class="w-full p-3 border rounded mb-4">

        <label>Relationship With Him/Her</label>
        <input id="relationship" class="w-full p-3 border rounded mb-4">

        <label>Your Phone Number</label>
        <input id="phone" class="w-full p-3 border rounded mb-6">

        <button id="saveButton" class="w-full bg-green-600 text-white py-3 rounded mb-4">Save</button>
        <button id="signOutButton" class="w-full bg-gray-600 text-white py-3 rounded">Sign Out</button>
    </div>
</main>

<script>
const COGNITO_CONFIG = {
    UserPoolId: 'us-east-1_dnF4Uj5RY',
    ClientId: '1eiq8thm150jeapi92ruvi58gk',
    IdentityPoolId: 'us-east-1:0c4b3fb1-4717-4071-9970-6f1296078580',
    Region: 'us-east-1',
    DynamoDBTable: 'my_DynamoDB'
};

const pool = new AmazonCognitoIdentity.CognitoUserPool({
    UserPoolId: COGNITO_CONFIG.UserPoolId,
    ClientId: COGNITO_CONFIG.ClientId
});

document.getElementById("signInButton").onclick = () => {
    const usernameInput = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!usernameInput || !password) {
        document.getElementById("loginError").textContent = "Please enter username/email and password";
        document.getElementById("loginError").classList.remove("hidden");
        return;
    }

    const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails({
        Username: usernameInput,
        Password: password
    });

    const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
        Username: usernameInput,
        Pool: pool
    });

    cognitoUser.authenticateUser(authenticationDetails, {
        onSuccess: result => {
            const idToken = result.getIdToken().getJwtToken();
            const payload = JSON.parse(atob(idToken.split('.')[1]));
            const userEmail = payload.email;

            if (!userEmail) {
                document.getElementById("loginError").textContent = "No se pudo obtener el email del usuario";
                document.getElementById("loginError").classList.remove("hidden");
                return;
            }

            AWS.config.region = COGNITO_CONFIG.Region;
            AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                IdentityPoolId: COGNITO_CONFIG.IdentityPoolId,
                Logins: {
                    [`cognito-idp.${COGNITO_CONFIG.Region}.amazonaws.com/${COGNITO_CONFIG.UserPoolId}`]: idToken
                }
            });

            AWS.config.credentials.get(err => {
                if (err) {
                    document.getElementById("loginError").textContent = "Error configurando credenciales: " + err.message;
                    document.getElementById("loginError").classList.remove("hidden");
                    return;
                }

                // Mostrar email en el campo User ID
                document.getElementById("id").value = userEmail;

                document.getElementById("loginBox").classList.add("hidden");
                document.getElementById("databaseForm").classList.remove("hidden");

                loadUserData(userEmail);
            });
        },
        onFailure: err => {
            document.getElementById("loginError").textContent = err.message || "Login failed";
            document.getElementById("loginError").classList.remove("hidden");
        }
    });
};

function loadUserData(userEmail) {
    const docClient = new AWS.DynamoDB.DocumentClient();
    docClient.get({
        TableName: COGNITO_CONFIG.DynamoDBTable,
        Key: { User_ID: userEmail }
    }, (err, data) => {
        if (err) {
            console.error("Error loading data:", err);
            return;
        }
        if (!data.Item) {
            console.log("No data found for this user");
            return;
        }

        document.getElementById("name").value = data.Item.name || "";
        document.getElementById("preferred_name").value = data.Item.preferred_name || "";
        document.getElementById("illnesses").value = data.Item.illnesses || "";
        document.getElementById("allergies").value = data.Item.allergies || "";
        document.getElementById("medications").value = data.Item.medications || "";
        document.getElementById("birth_place").value = data.Item.birth_place || "";
        document.getElementById("milestones").value = data.Item.milestones || "";
        document.getElementById("food_preferences").value = data.Item.food_preferences || "";
        document.getElementById("hobbies").value = data.Item.hobbies || "";
        document.getElementById("memories").value = data.Item.memories || "";
        document.getElementById("family_info").value = data.Item.family_info || "";
        document.getElementById("routine").value = data.Item.routine || "";
        document.getElementById("cultural_background").value = data.Item.cultural_background || "";
        document.getElementById("known_name").value = data.Item.known_name || "";
        document.getElementById("relationship").value = data.Item.relationship || "";
        document.getElementById("phone").value = data.Item.phone || "";
    });
}

document.getElementById("saveButton").addEventListener("click", () => {
    const userEmail = document.getElementById("id").value.trim();
    if (!userEmail) {
        alert("Error: No se detectó el email del usuario");
        return;
    }

    const docClient = new AWS.DynamoDB.DocumentClient();

    const item = {
        User_ID: userEmail,
        name: document.getElementById("name").value.trim(),
        preferred_name: document.getElementById("preferred_name").value.trim(),
        illnesses: document.getElementById("illnesses").value.trim(),
        allergies: document.getElementById("allergies").value.trim(),
        medications: document.getElementById("medications").value.trim(),
        birth_place: document.getElementById("birth_place").value.trim(),
        milestones: document.getElementById("milestones").value.trim(),
        food_preferences: document.getElementById("food_preferences").value.trim(),
        hobbies: document.getElementById("hobbies").value.trim(),
        memories: document.getElementById("memories").value.trim(),
        family_info: document.getElementById("family_info").value.trim(),
        routine: document.getElementById("routine").value.trim(),
        cultural_background: document.getElementById("cultural_background").value.trim(),
        known_name: document.getElementById("known_name").value.trim(),
        relationship: document.getElementById("relationship").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        updatedAt: new Date().toISOString()
    };

    docClient.put({
        TableName: COGNITO_CONFIG.DynamoDBTable,
        Item: item
    }, err => {
        if (err) {
            alert("Error saving: " + err.message);
        } else {
            alert("Saved successfully!");
        }
    });
});

document.getElementById("signOutButton").onclick = () => {
    if (pool.getCurrentUser()) {
        pool.getCurrentUser().signOut();
    }
    location.reload();
};
</script>

</body>
</html>
