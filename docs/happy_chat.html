<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRF - Happy Chat</title>
    <link rel="icon" type="image/x-icon" href="images/favicon_16_to_1024.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://assets.bedrock.aws.amazon.com/sdk/v3/aws-sdk.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

<header class="relative bg-cover bg-center h-64 flex items-center justify-center" style="background-image: url('images/banner.jpg')">
    <h1 class="text-6xl font-bold text-white drop-shadow-lg">GRF</h1>
</header>

<nav class="bg-blue-600 text-white p-4">
    <ul class="flex justify-center space-x-8">
        <li><a href="index.html" class="hover:underline">Home</a></li>
        <li><a href="types_of_clouds.html" class="hover:underline">Types of Clouds</a></li>
        <li><a href="happy_chat.html" class="hover:underline font-bold">Happy Chat</a></li>
        <li><a href="database.html" class="hover:underline">Database</a></li>
    </ul>
</nav>

<main class="max-w-3xl mx-auto my-10 p-6 text-center">
    <!-- Login -->
    <div id="loginBox" class="bg-white shadow-lg rounded-lg p-10">
        <h2 class="text-3xl font-semibold mb-8">Happy Chat Login</h2>
        <input id="username" type="email" placeholder="Email" class="w-full p-4 border rounded-lg text-lg mb-4" />
        <div class="relative mb-6">
            <input id="password" type="password" placeholder="Password" class="w-full p-4 border rounded-lg text-lg pr-12" />
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>
        </div>
        <button id="signInButton" class="w-full bg-blue-600 text-white py-4 rounded-lg text-xl hover:bg-blue-700">Sign In</button>
        <p id="loginError" class="text-red-600 mt-4 text-lg hidden"></p>
    </div>

    <!-- Scene + Widget -->
    <div id="companionContainer" class="hidden flex flex-col items-center mt-10 space-y-6">
        <img id="sceneImage" src="images/heartwarming_scene.png" class="w-96 rounded-xl shadow-lg" />

        <iframe
            id="elevenWidget"
            src="https://elevenlabs.io/app/talk-to?agent_id=agent_7001kc96ge93fwtrmpw4vt2qe70c&branch_id=agtbrch_1501kc96gfynestacfnzsc2m9gzh"
            class="w-full h-[600px] rounded-xl shadow-xl border"
        ></iframe>
    </div>
</main>

<script>
    const { CognitoIdentityProviderClient, InitiateAuthCommand } = AWS;

    const CONFIG = {
        region: "us-east-1",
        userPoolId: "us-east-1_dnF4Uj5RY",
        clientId: "1eiq8thm150jeapi92ruvi58gk",
    };

    function showError(msg) {
        const el = document.getElementById("loginError");
        el.textContent = msg;
        el.classList.remove("hidden");
    }

    // Login
    document.getElementById("signInButton").onclick = async () => {
        const email = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        if (!email || !password) return showError("Please fill in email and password");

        try {
            const cognitoClient = new CognitoIdentityProviderClient({ region: CONFIG.region });
            const command = new InitiateAuthCommand({
                AuthFlow: "USER_PASSWORD_AUTH",
                ClientId: CONFIG.clientId,
                AuthParameters: { USERNAME: email, PASSWORD: password },
            });

            await cognitoClient.send(command);

            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("companionContainer").classList.remove("hidden");
        } catch (err) {
            showError(err.message || "Login failed");
        }
    };

    // Password toggle
    document.getElementById("togglePassword")?.addEventListener("click", () => {
        const pass = document.getElementById("password");
        pass.type = pass.type === "password" ? "text" : "password";
    });

    // Widget event handling
    document.getElementById("elevenWidget").addEventListener("load", () => {
        window.addEventListener("message", (e) => {
            if (e.data?.event === "agent_call_started") {
                document.getElementById("sceneImage").src = "images/old_grandma.png";
            }
            if (e.data?.event === "agent_call_ended") {
                location.reload();
            }
        });
    });
</script>
</body>
</html>
