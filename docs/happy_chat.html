<html lang="en">

<!-- AWS SDK v2 included so we can call Cognito Identity credentials.get() - optional, used to populate temporary creds -->
<script src="https://sdk.amazonaws.com/js/aws-sdk-2.283.1.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

<header class="relative bg-cover bg-center h-48 flex items-center justify-center"
        style="background-image:url('images/banner.jpg')">

<nav class="bg-blue-600 text-white p-3">
  <ul class="flex justify-center gap-8">

<main class="max-w-3xl mx-auto my-8 p-6 text-center">
  <div id="loginBox" class="bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-semibold mb-6">Happy Chat Login</h2>
    <input id="username" placeholder="Username or Email" class="w-full p-3 border rounded mb-4" />
    <div class="relative mb-4">
      <input id="password" type="password" placeholder="Password" class="w-full p-3 border rounded" />
    </div>
    <button id="signInButton" class="w-full bg-blue-600 text-white p-3 rounded">Sign In</button>
    <p id="loginError" class="text-red-600 mt-3 hidden"></p>
  </div>

  <div id="companionContainer" class="hidden mt-8 flex flex-col items-center">
    <h2 class="text-2xl font-semibold mb-4">Your Companion</h2>

    <div id="companionFace" class="w-64 h-64 bg-yellow-200 rounded-full shadow flex items-center justify-center cursor-pointer">
      <img id="faceImg" src="images/waiting_only.gif" class="w-56 h-56" />
    </div>

    <p class="mt-4 text-gray-700">Click once to start streaming; click again to stop</p>

    <div class="mt-6">
      <button id="signOutButton" class="bg-gray-600 text-white px-6 py-2 rounded">Sign Out</button>
    </div>

    <p id="status" class="mt-4 text-sm text-gray-600"></p>
  </div>
</main>

<!-- Main logic as ES module so we can import the SDK from jsDelivr -->
<script type="module">
/*
  Direct Bedrock bidirectional streaming (Option B) using @aws-sdk/client-bedrock-runtime (v3)
  - Uses Cognito userPool authentication (amazon-cognito-identity-js) to get idToken
  - Exchanges idToken for Cognito Identity temporary AWS credentials (AWS.config.credentials)
  - Creates BedrockRuntimeClient with those temporary creds
  - Builds a ReadableStream that the SDK will use as the request body to push events & audio
  - Reads the response stream and plays audio events; listens for speech_start/speech_end to animate
*/

/* --------- Replace with your Cognito values (already provided) --------- */
const COGNITO_CONFIG = {
  UserPoolId: 'us-east-1_dnF4Uj5RY',
  ClientId: '1eiq8thm150jeapi92ruvi58gk',
  IdentityPoolId: 'us-east-1:0c4b3fb1-4717-4071-9970-6f1296078580',
  Region: 'us-east-1'
};

/* ----------------- Imports from CDN (ESM) -----------------
   This loads the Bedrock Runtime client from jsDelivr.
   If the import path ever changes, swap with the package's dist-es entrypoint.
*/
import { BedrockRuntimeClient, InvokeModelWithBidirectionalStreamCommand } from 'https://cdn.jsdelivr.net/npm/@aws-sdk/client-bedrock-runtime/dist-es/index.js';

const loginBox = document.getElementById('loginBox');
const companionContainer = document.getElementById('companionContainer');
const loginError = document.getElementById('loginError');
const faceImg = document.getElementById('faceImg');
const statusEl = document.getElementById('status');

const waitingSrc = 'images/waiting_only.gif';
const talkingSrc = 'images/talking_only.gif';

let bedrockClient = null;
let streamingController = null;
let mediaStream = null;
let recorder = null;
let streaming = false;
let sessionId = null;

let modelIsTalking = false;
function setModelTalking(v) { modelIsTalking = v; faceImg.src = v ? talkingSrc : waitingSrc; }

/* -----------------------------------------------------
   Cognito UserPool sign-in (using amazon-cognito-identity-js)
   This part uses the v1 Cognito library you already include.
-----------------------------------------------------*/
const pool = new AmazonCognitoIdentity.CognitoUserPool({
  UserPoolId: COGNITO_CONFIG.UserPoolId,
  ClientId: COGNITO_CONFIG.ClientId
});

document.getElementById('signInButton').addEventListener('click', () => {
  hideLoginError();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) {
    showLoginError('Enter username & password');
    return;
  }

  const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({ Username: username, Password: password });
  const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: username, Pool: pool });

  cognitoUser.authenticateUser(authDetails, {
    onSuccess: async (result) => {
      const idToken = result.getIdToken().getJwtToken();
      try {
        await exchangeIdTokenForAwsCreds(idToken);
        await initBedrockClient();
        loginBox.classList.add('hidden');
        companionContainer.classList.remove('hidden');
        status('Ready — click the face to start streaming');
      } catch (err) {
        console.error('Creds/init error', err);
        showLoginError('Initialization error: ' + (err.message || err));
      }
    },
    onFailure: err => showLoginError(err.message || JSON.stringify(err)),
    newPasswordRequired: () => showLoginError('New password required (not supported here)')
  });
});

function showLoginError(msg) { loginError.textContent = msg; loginError.classList.remove('hidden'); }
function hideLoginError() { loginError.classList.add('hidden'); }
function status(txt) { statusEl.textContent = txt; }

/* Exchange the ID token for temporary AWS credentials using AWS SDK v2's CognitoIdentityCredentials */
async function exchangeIdTokenForAwsCreds(idToken) {
  AWS.config.region = COGNITO_CONFIG.Region;
  AWS.config.credentials = new AWS.CognitoIdentityCredentials({
    IdentityPoolId: COGNITO_CONFIG.IdentityPoolId,
    Logins: {
      [`cognito-idp.${COGNITO_CONFIG.Region}.amazonaws.com/${COGNITO_CONFIG.UserPoolId}`]: idToken
    }
  });

  return new Promise((resolve, reject) => {
    AWS.config.credentials.get(err => {
      if (err) return reject(err);
      // Now AWS.config.credentials contains accessKeyId, secretAccessKey, sessionToken
      resolve();
    });
  });
}

/* Instantiate BedrockRuntimeClient with the temporary creds */
async function initBedrockClient() {
  const creds = {
    accessKeyId: AWS.config.credentials.accessKeyId,
    secretAccessKey: AWS.config.credentials.secretAccessKey,
    sessionToken: AWS.config.credentials.sessionToken
  };

  bedrockClient = new BedrockRuntimeClient({
    region: COGNITO_CONFIG.Region,
    credentials: creds
  });
}

/* -----------------------------
  Bidirectional stream implementation
   We'll:
   - Create a ReadableStream (outgoing) and write JSON control events and audio chunks into it.
   - Call InvokeModelWithBidirectionalStreamCommand with body = outgoing stream
   - Read the response stream and handle events + audio chunks.
--------------------------------*/
async function startPushStreaming() {
  if (!bedrockClient) throw new Error('Bedrock client not initialized');

  if (!mediaStream) {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } });
  }

  // We'll use MediaRecorder to capture chunks (webm/opus) and push those bytes through the request stream.
  recorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm;codecs=opus' });

  const encoder = new TextEncoder();

  // Controller and queue for outgoing stream
  let push;
  const outgoing = new ReadableStream({
    start(controller) {
      push = chunk => controller.enqueue(chunk);
      streamingController = controller;
      // first event: session start metadata (you may include any model params here)
      const startEvent = {
        type: 'session_start',
        modelId: 'amazon.nova-2-sonic-v1:0',
        // any additional metadata the model expects can go here
      };
      controller.enqueue(encoder.encode(JSON.stringify(startEvent) + '\n'));
    },
    pull() { /* no-op */ },
    cancel(reason) {
      console.log('Outgoing stream canceled', reason);
    }
  });

  // Handle MediaRecorder chunk -> push to outgoing
  recorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) {
      // read as arrayBuffer and push raw bytes
      const reader = new FileReader();
      reader.onload = () => {
        const bytes = new Uint8Array(reader.result);
        push(bytes);
      };
      reader.readAsArrayBuffer(e.data);
    }
  };

  recorder.onstop = () => {
    // send end_of_stream event (model will finalize)
    const endEvent = { type: 'end_of_input' };
    push(encoder.encode(JSON.stringify(endEvent) + '\n'));
    // close the outgoing stream after a tiny delay to ensure event gets sent
    setTimeout(() => streamingController.close(), 100);
  };

  // Prepare command
  const command = new InvokeModelWithBidirectionalStreamCommand({
    modelId: 'amazon.nova-2-sonic-v1:0',
    // contentType/accept headers may be required by the model — leaving model-specific handling to the runtime
    body: outgoing
  });

  status('Opening Bedrock bidirectional stream…');

  // Send command - returns a response with a readable stream body
  const response = await bedrockClient.send(command);

  // Response body is a stream of events + audio chunks. We'll read it using the response.body (a ReadableStream)
  // NOTE: SDK may expose different shapes depending on environment; attempt to read as async iterable if provided
  const respBody = response?.body;
  if (!respBody) throw new Error('No response body from Bedrock');

  // Helper: read chunks from response stream and parse
  // We attempt two strategies: if body is an async iterable, use for await; otherwise use getReader()
  if (respBody[Symbol.asyncIterator]) {
    // async iterable case
    (async () => {
      for await (const chunk of respBody) {
        await handleIncomingChunk(chunk);
      }
      console.log('Bedrock response stream ended (iterable).');
      status('Connection closed by Bedrock');
      setModelTalking(false);
      streaming = false;
    })();
  } else if (typeof respBody.getReader === 'function') {
    const reader = respBody.getReader();
    const decoder = new TextDecoder();
    (async () => {
      let reading = true;
      while (reading) {
        const { value, done } = await reader.read();
        if (done) {
          reading = false;
          break;
        }
        await handleIncomingChunk(value);
      }
      console.log('Bedrock response stream ended (getReader).');
      status('Connection closed by Bedrock');
      setModelTalking(false);
      streaming = false;
    })();
  } else {
    throw new Error('Unsupported response body type from Bedrock SDK');
  }

  // Start the recorder after opening the stream
  recorder.start(200); // 200ms chunks
  streaming = true;
  status('Streaming mic → Nova (click face to stop)');
}

/* Handle incoming chunk from model.
   Model will emit event-like JSON lines and binary audio frames.
   We'll try to parse incoming bytes: if chunk starts with "{" treat as JSON text event (newline delimited).
   Otherwise treat as audio bytes (encoded audio).
   This parsing is model/runtime specific — if your model sends framed bytes/events differently you may need to adapt.
*/
const incomingTextDecoder = new TextDecoder();

async function handleIncomingChunk(chunk) {
  // chunk may be Uint8Array or ArrayBuffer
  let bytes;
  if (chunk instanceof ArrayBuffer) bytes = new Uint8Array(chunk);
  else if (chunk instanceof Uint8Array) bytes = chunk;
  else if (chunk?.buffer instanceof ArrayBuffer) bytes = new Uint8Array(chunk.buffer);
  else {
    console.warn('Unknown chunk type', chunk);
    return;
  }

  // Heuristic: if the chunk starts with ASCII "{" or "[" treat as JSON text event (newline-separated)
  const first = bytes[0];
  if (first === 0x7b || first === 0x5b) { // '{' or '['
    const txt = incomingTextDecoder.decode(bytes);
    try {
      // Some responses send newline-delimited JSON events; split and parse each line
      for (const line of txt.split(/\r?\n/)) {
        if (!line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch (e) { console.warn('JSON parse failed for line', line); continue; }
        if (msg.type === 'session') sessionId = msg.sessionId;
        if (msg.type === 'speech_start') setModelTalking(true);
        if (msg.type === 'speech_end') setModelTalking(false);
        if (msg.type === 'emotion') { /* optionally map to face effects */ }
        // other events...
      }
    } catch (e) {
      console.error('Failed to parse incoming JSON event', e);
    }
    return;
  }

  // Otherwise treat chunk as audio PCM/encoded audio; we'll attempt to decode and play
  try {
    // Some models stream raw PCM; some stream encoded audio (e.g. opus/webm). We'll try decodeAudioData for whatever we receive.
    const audioBuf = await audioCtx.decodeAudioData(bytes.buffer.slice(0));
    playBuffer(audioBuf);
  } catch (e) {
    // decodeAudioData can fail if bytes are not a supported container
    // If model sends encoded audio container (webm/opus), you may need a different path (Media Source Extensions) or construct a Blob URL
    // We'll fallback to creating a Blob and playing it (may have more latency)
    try {
      const blob = new Blob([bytes], { type: 'audio/webm;codecs=opus' });
      const url = URL.createObjectURL(blob);
      const a = new Audio(url);
      a.play().catch(err => console.warn('Audio play failed', err));
      // cleanup after short delay
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (err) {
      console.error('Could not play incoming audio chunk', err);
    }
  }
}

/* Audio playback helpers */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let playbackQueue = Promise.resolve();
function playBuffer(buffer) {
  playbackQueue = playbackQueue.then(() => new Promise(resolve => {
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(audioCtx.destination);
    src.onended = resolve;
    src.start();
  }));
}

/* Stop streaming and close outgoing stream */
async function stopPushStreaming() {
  if (!streaming) return;
  // stop MediaRecorder; onstop handler will enqueue end_of_input and close outgoing stream
  recorder && recorder.state === 'recording' && recorder.stop();

  // mark UI
  streaming = false;
  status('Stopping…');
  // Let the response stream finish naturally; model will emit final speech_end and then close
}

/* UI: toggle start/stop on companion face click */
document.getElementById('companionFace').addEventListener('click', async () => {
  try {
    if (!streaming) {
      await startPushStreaming();
    } else {
      await stopPushStreaming();
    }
  } catch (err) {
    console.error('Streaming error', err);
    status('Streaming error: ' + (err.message || err));
  }
});

/* Sign out */
document.getElementById('signOutButton').addEventListener('click', () => {
  pool.getCurrentUser()?.signOut();
  location.reload();
});

</script>
</body>
