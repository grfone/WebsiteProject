<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRF - Happy Chat</title>
    <link rel="icon" type="image/x-icon" href="images/favicon_16_to_1024.ico">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Import map for AWS SDK v3 browser bundles -->
    <script type="importmap">
    {
      "imports": {
        "@aws-sdk/client-cognito-identity-provider": "https://cdn.jsdelivr.net/gh/aws-sdk/client-cognito-identity-provider@latest/index.min.mjs",
        "@aws-sdk/credential-provider-cognito-identity": "https://cdn.jsdelivr.net/gh/aws-sdk/credential-provider-cognito-identity@latest/index.min.mjs",
        "@aws-sdk/client-bedrock-runtime": "https://cdn.jsdelivr.net/gh/aws-sdk/client-bedrock-runtime@latest/index.min.mjs"
      }
    }
    </script>
</head>
<body class="bg-gray-100 font-sans">

<header class="relative bg-cover bg-center h-64 flex items-center justify-center"
        style="background-image: url('images/banner.jpg')">
    <h1 class="text-6xl font-bold text-white drop-shadow-lg">GRF</h1>
</header>

<nav class="bg-blue-600 text-white p-4">
    <ul class="flex justify-center space-x-8">
        <li><a href="index.html" class="hover:underline">Home</a></li>
        <li><a href="types_of_clouds.html" class="hover:underline">Types of Clouds</a></li>
        <li><a href="happy_chat.html" class="hover:underline font-bold">Happy Chat</a></li>
        <li><a href="database.html" class="hover:underline">Database</a></li>
    </ul>
</nav>

<main class="max-w-3xl mx-auto my-10 p-6 text-center">

    <!-- Login -->
    <div id="loginBox" class="bg-white shadow-lg rounded-lg p-10">
        <h2 class="text-3xl font-semibold mb-8">Happy Chat Login</h2>
        <input id="username" type="email" placeholder="Email" class="w-full p-4 border rounded-lg text-lg mb-4">
        <input id="password" type="password" placeholder="Password" class="w-full p-4 border rounded-lg text-lg mb-4">
        <button id="signInButton" class="w-full bg-blue-600 text-white py-4 rounded-lg text-xl hover:bg-blue-700">Sign In</button>
        <p id="loginError" class="text-red-600 mt-4 text-lg hidden"></p>
    </div>

    <!-- Companion -->
    <div id="companionContainer" class="hidden flex flex-col items-center mt-10">
        <h2 class="text-3xl font-semibold mb-6">Your Happy Companion</h2>
        <div id="companionFace" class="w-64 h-64 bg-yellow-200 rounded-full shadow-2xl flex items-center justify-center cursor-pointer hover:scale-105 transition transform">
            <img id="faceImg" src="images/waiting_only.gif" class="w-56 h-56">
        </div>
        <p class="mt-6 text-lg text-gray-700">Click the face and speak!</p>
        <button id="signOutButton" class="mt-8 bg-gray-600 text-white px-8 py-3 rounded-lg hover:bg-gray-700">Sign Out</button>
    </div>

</main>

<script type="module">
    import { CognitoIdentityProviderClient, InitiateAuthCommand } from "@aws-sdk/client-cognito-identity-provider";
    import { fromCognitoIdentityPool } from "@aws-sdk/credential-provider-cognito-identity";
    import { BedrockRuntimeClient, InvokeModelWithBidirectionalStreamCommand } from "@aws-sdk/client-bedrock-runtime";

    const CONFIG = {
        region: "us-east-1",
        userPoolId: "us-east-1_dnF4Uj5RY",
        clientId: "1eiq8thm150jeapi92ruvi58gk",
        identityPoolId: "us-east-1:0c4b3fb1-4717-4071-9970-6f1296078580"
    };

    const MODEL_ID = "amazon.nova-2-sonic-v1:0";
    const SYSTEM_PROMPT = "You are a super happy, fun companion who loves talking about clouds, weather, and nature. Always be cheerful and short!";

    let bedrockClient = null;
    let isStreaming = false;
    let mediaRecorder = null;
    let audioChunks = [];
    const faceImg = document.getElementById("faceImg");
    const waitingSrc = "images/waiting_only.gif";
    const talkingSrc = "images/talking_only.gif";

    function updateFace(talking) {
        faceImg.src = talking ? talkingSrc : waitingSrc;
    }

    function showError(msg) {
        document.getElementById("loginError").textContent = msg;
        document.getElementById("loginError").classList.remove("hidden");
    }

    document.getElementById("signInButton").onclick = async () => {
        const email = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        if (!email || !password) return showError("Enter email and password");

        try {
            const cognitoClient = new CognitoIdentityProviderClient({ region: CONFIG.region });
            const authCmd = new InitiateAuthCommand({
                AuthFlow: "USER_PASSWORD_AUTH",
                ClientId: CONFIG.clientId,
                AuthParameters: { USERNAME: email, PASSWORD: password }
            });
            const authResult = await cognitoClient.send(authCmd);
            const idToken = authResult.AuthenticationResult.IdToken;

            const credentials = fromCognitoIdentityPool({
                clientConfig: { region: CONFIG.region },
                identityPoolId: CONFIG.identityPoolId,
                logins: { [`cognito-idp.${CONFIG.region}.amazonaws.com/${CONFIG.userPoolId}`]: idToken }
            });

            bedrockClient = new BedrockRuntimeClient({ region: CONFIG.region, credentials });

            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("companionContainer").classList.remove("hidden");
            console.log("Ready! Click the face and speak.");
        } catch (err) {
            showError(err.message || "Login failed");
        }
    };

    document.getElementById("companionFace").onclick = () => {
        if (!bedrockClient) return showError("Log in first");
        isStreaming ? stopStreaming() : startStreaming();
    };

    async function startStreaming() {
        isStreaming = true;
        updateFace(false);
        audioChunks = [];

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
            mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/wav" });
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.start();

            setTimeout(() => mediaRecorder.state === "recording" && mediaRecorder.stop(), 8000);

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
                const base64 = await blobToBase64(audioBlob).then(d => d.split(",")[1]);

                const events = [
                    JSON.stringify({ event: { sessionStart: { inferenceConfiguration: { temperature: 0.7 } } } }),
                    JSON.stringify({ event: { promptStart: { promptName: "user", audioOutput: { enabled: true } } } }),
                    JSON.stringify({ event: { contentStart: { role: "system" } } }),
                    JSON.stringify({ event: { content: [{ text: SYSTEM_PROMPT }] } }),
                    JSON.stringify({ event: { contentEnd: {} } }),
                    JSON.stringify({ event: { contentStart: { role: "user" } } }),
                    JSON.stringify({ event: { content: [{ audioInput: { data: base64, encoding: "base64", sampleRate: 16000 } }] } }),
                    JSON.stringify({ event: { contentEnd: {} } }),
                    JSON.stringify({ event: { promptEnd: {} } }),
                    JSON.stringify({ event: { sessionEnd: {} } })
                ].join("\n");

                const cmd = new InvokeModelWithBidirectionalStreamCommand({
                    modelId: MODEL_ID,
                    contentType: "application/jsonlines",
                    accept: "application/jsonlines",
                    body: events
                });

                updateFace(true);
                const response = await bedrockClient.send(cmd);
                let fullAudio = "";

                for await (const chunk of response.body) {
                    const text = new TextDecoder().decode(chunk.chunk?.bytes);
                    for (const line of text.split("\n").filter(Boolean)) {
                        try {
                            const json = JSON.parse(line);
                            if (json.event?.response?.audioOutput?.data) fullAudio += json.event.response.audioOutput.data;
                        } catch {}
                    }
                }

                if (fullAudio) {
                    const audio = new Audio(URL.createObjectURL(base64ToBlob(fullAudio)));
                    await audio.play();
                }
                updateFace(false);
                stream.getTracks().forEach(t => t.stop());
                isStreaming = false;
            };
        } catch (err) {
            showError("Microphone denied");
            isStreaming = false;
        }
    }

    function stopStreaming() {
        if (mediaRecorder?.state === "recording") mediaRecorder.stop();
        isStreaming = false;
        updateFace(false);
    }

    function blobToBase64(blob) {
        return new Promise(res => {
            const reader = new FileReader();
            reader.onloadend = () => res(reader.result);
            reader.readAsDataURL(blob);
        });
    }

    function base64ToBlob(b64) {
        const binary = atob(b64);
        const arr = Uint8Array.from(binary, c => c.charCodeAt(0));
        return new Blob([arr], { type: "audio/wav" });
    }

    document.getElementById("signOutButton").onclick = () => location.reload();
</script>
</body>
</html>
