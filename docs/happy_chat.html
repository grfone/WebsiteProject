<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRF - Happy Chat</title>
    <link rel="icon" type="image/x-icon" href="images/favicon_16_to_1024.ico">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Cognito + AWS -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.283.1.min.js"></script>

    <!-- ElevenLabs -->
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async></script>
</head>

<body class="bg-gray-100 font-sans">

<header class="relative bg-cover bg-center h-64 flex items-center justify-center"
        style="background-image: url('images/banner.jpg')">
    <h1 class="text-6xl font-bold text-white drop-shadow-lg">GRF</h1>
</header>

<nav class="bg-blue-600 text-white p-4">
    <ul class="flex justify-center space-x-8">
        <li><a href="index.html">Home</a></li>
        <li><a href="types_of_clouds.html">Types of Clouds</a></li>
        <li><a href="happy_chat.html" class="font-bold">Happy Chat</a></li>
        <li><a href="database.html">Database</a></li>
    </ul>
</nav>

<main class="max-w-3xl mx-auto my-10 p-6 text-center">

<!-- LOGIN -->
<div id="loginBox" class="bg-white shadow-lg rounded-lg p-10">
    <h2 class="text-3xl font-semibold mb-8">Happy Chat Login</h2>

    <input id="username" placeholder="Username or Email"
           class="w-full p-4 border rounded-lg text-lg mb-4">

    <input id="password" type="password" placeholder="Password"
           class="w-full p-4 border rounded-lg text-lg mb-6">

    <button id="signInButton"
            class="w-full bg-blue-600 text-white py-4 rounded-lg text-xl">
        Sign In
    </button>

    <p id="loginError" class="text-red-600 mt-4 hidden"></p>
</div>

<!-- COMPANION -->
<div id="companionContainer" class="hidden flex flex-col items-center mt-16 space-y-12">
    <img src="images/heartwarming_scene.jpg"
         class="w-full max-w-3xl rounded-2xl shadow-2xl">

    <elevenlabs-convai
        id="elevenWidget"
        agent-id="agent_7001kc96ge93fwtrmpw4vt2qe70c"
        class="w-full max-w-3xl">
    </elevenlabs-convai>
</div>

</main>

<script>
const COGNITO_CONFIG = {
    UserPoolId: 'us-east-1_dnF4Uj5RY',
    ClientId: '1eiq8thm150jeapi92ruvi58gk',
    IdentityPoolId: 'us-east-1:0c4b3fb1-4717-4071-9970-6f1296078580',
    Region: 'us-east-1',
    DynamoDBTable: 'my_DynamoDB'
};

const pool = new AmazonCognitoIdentity.CognitoUserPool({
    UserPoolId: COGNITO_CONFIG.UserPoolId,
    ClientId: COGNITO_CONFIG.ClientId
});

document.getElementById("signInButton").onclick = () => {
    const usernameInput = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!usernameInput || !password) {
        document.getElementById("loginError").textContent = "Please enter username/email and password";
        document.getElementById("loginError").classList.remove("hidden");
        return;
    }

    const auth = new AmazonCognitoIdentity.AuthenticationDetails({
        Username: usernameInput,
        Password: password
    });

    const user = new AmazonCognitoIdentity.CognitoUser({
        Username: usernameInput,
        Pool: pool
    });

    user.authenticateUser(auth, {
        onSuccess: result => {
            // Decodificar el ID Token para extraer el email
            const idToken = result.getIdToken().getJwtToken();
            const payload = JSON.parse(atob(idToken.split('.')[1]));
            const userEmail = payload.email;  // Este es el email real del usuario

            if (!userEmail) {
                document.getElementById("loginError").textContent = "No se pudo obtener el email del usuario";
                document.getElementById("loginError").classList.remove("hidden");
                return;
            }

            // Configurar credenciales AWS
            AWS.config.region = COGNITO_CONFIG.Region;
            AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                IdentityPoolId: COGNITO_CONFIG.IdentityPoolId,
                Logins: {
                    [`cognito-idp.${COGNITO_CONFIG.Region}.amazonaws.com/${COGNITO_CONFIG.UserPoolId}`]: idToken
                }
            });

            AWS.config.credentials.get(err => {
                if (err) {
                    document.getElementById("loginError").textContent = "Error de credenciales: " + err.message;
                    document.getElementById("loginError").classList.remove("hidden");
                    return;
                }

                // Ahora usamos userEmail como User_ID en DynamoDB
                // ==== database.html ====
                if (document.getElementById("id")) {
                    document.getElementById("id").value = userEmail;
                }
                document.getElementById("loginBox").classList.add("hidden");

                if (document.getElementById("databaseForm")) {
                    document.getElementById("databaseForm").classList.remove("hidden");
                    loadUserData(userEmail);
                }

                if (document.getElementById("companionContainer")) {
                    document.getElementById("companionContainer").classList.remove("hidden");
                    loadUserData(userEmail);
                }
            });
        },
        onFailure: err => {
            document.getElementById("loginError").textContent = err.message || "Login failed";
            document.getElementById("loginError").classList.remove("hidden");
        }
    });
};

function loadUserData(userId) {
    const docClient = new AWS.DynamoDB.DocumentClient();
    docClient.get({
        TableName: COGNITO_CONFIG.DynamoDBTable,
        Key: { User_ID: userId }
    }, (err, data) => {
        if (err || !data.Item) {
            console.error(err || "No data found");
            return;
        }

        const vars = {
            userName: data.Item.preferred_name || data.Item.name || "",
            fullName: data.Item.name || "",
            illnesses: data.Item.illnesses || "",
            allergies: data.Item.allergies || "",
            medications: data.Item.medications || "",
            birthPlace: data.Item.birth_place || "",
            hobbies: data.Item.hobbies || "",
            memories: data.Item.memories || "",
            routine: data.Item.routine || "",
            culturalBackground: data.Item.cultural_background || "",
            knownName: data.Item.known_name || "",
            relationship: data.Item.relationship || "",
            phone: data.Item.phone || "",
            // Variables que faltaban en happy_chat.html original
            milestones: data.Item.milestones || "",
            foodPreferences: data.Item.food_preferences || "",
            familyInfo: data.Item.family_info || ""
        };

        const widget = document.getElementById("elevenWidget");
        widget.setAttribute("dynamic-variables", JSON.stringify(vars));

        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("companionContainer").classList.remove("hidden");
    });
}
</script>

<style>
elevenlabs-convai::part(button) {
    background: #1d4ed8 !important;
    border-radius: 9999px !important;
}
</style>

</body>
</html>
