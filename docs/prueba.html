<!DOCTYPE html>
<html>
<head>
  <title>Nova 2 Sonic Chat</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 600px; margin: auto; }
    #response { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Talk to Amazon Nova 2 Sonic</h1>
  <input type="text" id="prompt" placeholder="Ask anything..." style="width:100%; padding:10px; font-size:16px;">
  <button onclick="send()" style="padding:10px 20px; font-size:16px; margin-top:10px;">Send</button>
  <div id="response">Response will appear here...</div>

  <script>

    const API_URL = "https://8ohs77gft5.execute-api.us-east-1.amazonaws.com/my_first_stage/my_lambda_function";

    async function send() {
      const prompt = document.getElementById("prompt").value;
      document.getElementById("response").innerHTML = "Thinking...";

      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });

      const data = await res.json();
      document.getElementById("response").innerHTML = data.response || data.error;
    }
  </script>
</body>
</html>
