<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GRF - Happy Chat (debug)</title>
  <link rel="icon" type="image/x-icon" href="images/favicon_16_to_1024.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script>
  <script src="https://sdk.amazonaws.com/js/aws-sdk-2.283.1.min.js"></script>
  <style>
    /* debug visuals */
    #companionFace.debug-highlight { outline: 3px dashed rgba(34,197,94,0.6); }
    #debugConsole {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 360px;
      max-height: 50vh;
      overflow: auto;
      background: rgba(17,24,39,0.95);
      color: #e6eef8;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      border-radius: 8px;
      z-index: 9999;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    #debugConsole header { font-weight: 700; margin-bottom: 6px; display:flex; justify-content:space-between; gap:8px; }
    #debugConsole button { background: transparent; color: #9ca3af; border: none; cursor: pointer; }
    #debugConsole pre { white-space: pre-wrap; word-break: break-word; margin:0; }
  </style>
</head>
<body class="bg-gray-100 font-sans">
  <header class="relative bg-cover bg-center h-64 flex items-center justify-center"
          style="background-image: url('images/banner.jpg')">
    <h1 class="text-6xl font-bold text-white drop-shadow-lg">GRF</h1>
  </header>

  <nav class="bg-blue-600 text-white p-4">
    <ul class="flex justify-center space-x-8">
      <li><a href="index.html" class="hover:underline">Home</a></li>
      <li><a href="types_of_clouds.html" class="hover:underline">Types of Clouds</a></li>
      <li><a href="happy_chat.html" class="hover:underline font-bold">Happy Chat</a></li>
      <li><a href="database.html" class="hover:underline">Database</a></li>
    </ul>
  </nav>

  <main class="max-w-3xl mx-auto my-10 p-6 text-center">
    <div id="loginBox" class="bg-white shadow-lg rounded-lg p-10">
      <h2 class="text-3xl font-semibold mb-8">Happy Chat Login</h2>
      <input id="username" type="text" placeholder="Username or Email" class="w-full p-4 border rounded-lg text-lg mb-4">
      <div class="relative mb-6">
        <input id="password" type="password" placeholder="Password" class="w-full p-4 border rounded-lg text-lg pr-12">
        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 hover:text-gray-800">
          <svg id="eyeIcon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path id="eyeIconPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>
      <button id="signInButton" class="w-full bg-blue-600 text-white py-4 rounded-lg text-xl hover:bg-blue-700 transition">
        Sign In
      </button>
      <p id="loginError" class="text-red-600 mt-4 text-lg hidden"></p>
    </div>

    <div id="companionContainer" class="hidden flex flex-col items-center mt-10">
      <h2 class="text-3xl font-semibold mb-6">Your Companion</h2>
      <!-- ADDED tabindex so it's focusable and testable -->
      <div id="companionFace" tabindex="0" class="w-64 h-64 bg-yellow-200 rounded-full shadow-2xl flex items-center justify-center cursor-pointer hover:scale-105 transition transform">
        <img id="faceImg" src="images/waiting_only.gif" alt="Companion" class="w-56 h-56">
      </div>
      <p class="mt-6 text-lg text-gray-700">Click or tap the face to talk!</p>
      <button id="signOutButton" class="mt-8 bg-gray-600 text-white px-8 py-3 rounded-lg hover:bg-gray-700">
        Sign Out
      </button>
    </div>
  </main>

  <!-- Debug console -->
  <div id="debugConsole" aria-live="polite" role="status" style="display:block;">
    <header>
      <span>Debug console</span>
      <div>
        <button id="dbgClear">Clear</button>
        <button id="dbgHide">Hide</button>
      </div>
    </header>
    <pre id="dbgOutput"></pre>
  </div>

  <script>
    // -------------------------
    // Debug helpers
    // -------------------------
    const dbgDiv = document.getElementById('dbgOutput');
    function dbg(...args) {
      const text = args.map(a => {
        if (typeof a === 'object') try { return JSON.stringify(a); } catch { return String(a); }
        return String(a);
      }).join(' ');
      console.log('[DBG]', text);
      const now = new Date().toLocaleTimeString();
      dbgDiv.textContent = (dbgDiv.textContent ? dbgDiv.textContent + '\n' : '') + `[${now}] ${text}`;
      dbgDiv.scrollTop = dbgDiv.scrollHeight;
      // keep last 3000 chars
      if (dbgDiv.textContent.length > 30000) dbgDiv.textContent = dbgDiv.textContent.slice(-30000);
    }
    document.getElementById('dbgClear').addEventListener('click', () => dbgDiv.textContent = '');
    document.getElementById('dbgHide').addEventListener('click', () => {
      const el = document.getElementById('debugConsole');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    });

    // -------------------------
    // Existing app code (with debug logs added)
    // -------------------------
    const COGNITO_CONFIG = {
        UserPoolId: 'us-east-1_dnF4Uj5RY',
        ClientId: '1eiq8thm150jeapi92ruvi58gk',
        IdentityPoolId: 'us-east-1:0c4b3fb1-4717-4071-9970-6f1296078580',
        Region: 'us-east-1',
    };
    const WS_URL = "wss://st57mljnn5.execute-api.us-east-1.amazonaws.com/prod";

    const pool = new AmazonCognitoIdentity.CognitoUserPool({
      UserPoolId: COGNITO_CONFIG.UserPoolId,
      ClientId: COGNITO_CONFIG.ClientId
    });

    const loginBox = document.getElementById("loginBox");
    const companionContainer = document.getElementById("companionContainer");
    const errorEl = document.getElementById("loginError");
    const faceImg = document.getElementById("faceImg");
    const companionFace = document.getElementById("companionFace");
    const waitingSrc = "images/waiting_only.gif";
    const talkingSrc = "images/talking_only.gif";

    let currentUser = null;
    let socket = null;
    let socketQueue = [];
    let recorder = null;
    let mediaStream = null;
    let idToken = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let playbackQueue = Promise.resolve();
    let isRecording = false;

    function showError(msg) { errorEl.textContent = msg; errorEl.classList.remove("hidden"); dbg('showError', msg); }
    function hideError() { errorEl.classList.add("hidden"); dbg('hideError'); }

    // password toggle (no change)
    document.getElementById("togglePassword").addEventListener("click", function () {
      const pwd = document.getElementById("password");
      const iconPath = document.getElementById("eyeIconPath");
      const hidden = pwd.type === "password";
      pwd.type = hidden ? "text" : "password";
      iconPath.setAttribute("d", hidden
        ? "M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 012.291-3.95M9.88 9.88A3 3 0 0114.12 14.12M3 3l18 18"
        : "M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z");
    });

    // sign in
    document.getElementById("signInButton").addEventListener("click", () => {
      hideError();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      dbg('signIn clicked', {usernamePresent: !!username});
      if (!username || !password) return showError("Enter username and password");

      const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({ Username: username, Password: password });
      const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: username, Pool: pool });

      cognitoUser.authenticateUser(authDetails, {
        onSuccess: result => {
          dbg('cognito onSuccess');
          currentUser = username;
          idToken = result.getIdToken().getJwtToken();
          loginBox.classList.add("hidden");
          companionContainer.classList.remove("hidden");
          connectWebSocket();
        },
        onFailure: err => { dbg('cognito onFailure', err); showError(err.message || "Login failed"); }
      });
    });

   // --- STATUS LOGGER ---
function logStatus(tag) {
    console.log(tag, {
        audioState: audioCtx.state,
        socketState: socket ? socket.readyState : "no-socket",
        isRecording,
        hasMedia: !!mediaStream,
        currentUser
    });
}

// --- WEBSOCKET CONNECTION ---
function connectWebSocket() {
    console.log("[WS] connectWebSocket", { idTokenPresent: !!idToken });

    return new Promise(resolve => {
        try {
            if (socket && socket.readyState === WebSocket.OPEN) {
                console.log("[WS] already open");
                return resolve(true);
            }

            const urlWithToken = `${WS_URL}?token=${encodeURIComponent(idToken)}`;
            console.log("[WS] opening", urlWithToken.replace(/token=.*/, "token=<masked>"));

            socket = new WebSocket(urlWithToken);
            socket.binaryType = "arraybuffer";

            socket.onopen = () => {
                console.log("[WS] open");
                resolve(true);
            };

            socket.onerror = e => {
                console.log("[WS] error", e);
                resolve(false);
            };

            socket.onclose = e => {
                console.log("[WS] closed", e);
            };

            socket.onmessage = handleSocketMessage;
        } catch (err) {
            console.log("[WS] exception", err);
            resolve(false);
        }
    });
}

// --- MICROPHONE ACCESS ---
async function requestMic() {
    console.log("[MIC] requesting access...");

    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        console.log("[MIC] granted");
        return true;
    } catch (err) {
        console.log("[MIC] denied", err);
        showError("Microphone access denied.");
        return false;
    }
}

// --- CLICK HANDLER ---
async function toggleTalking() {
    console.log("[TALK] toggleTalking invoked", { isRecording });

    // Ensure socket
    if (!socket || socket.readyState !== WebSocket.OPEN) {
        console.log("[TALK] socket not open → reconnecting…");
        const ok = await connectWebSocket();
        if (!ok) {
            showError("Cannot connect to server.");
            return;
        }
    }

    // STOP RECORDING
    if (isRecording) {
        console.log("[TALK] stopping recording");
        recorder.stop();
        isRecording = false;
        faceImg.src = waitingSrc;

        try {
            socket.send(JSON.stringify({ type: "end_of_utterance" }));
        } catch (e) {
            console.log("[TALK] send end_of_utterance failed", e);
        }

        logStatus("[TALK] after stop");
        return;
    }

    // START RECORDING
    console.log("[TALK] start recording requested");

    if (!mediaStream) {
        const micOK = await requestMic();
        if (!micOK) return;
    }

    console.log("[TALK] creating MediaRecorder");

    try {
        recorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm;codecs=opus" });

        recorder.ondataavailable = async e => {
            console.log("[REC] dataavailable", { size: e.data.size });

            if (e.data.size > 0 && socket.readyState === WebSocket.OPEN) {
                const arrayBuffer = await e.data.arrayBuffer();
                const uint8 = new Uint8Array(arrayBuffer);
                let binary = '';
                for (let i = 0; i < uint8.length; i++) binary += String.fromCharCode(uint8[i]);
                const base64Audio = btoa(binary);

                try {
                    socket.send(JSON.stringify({ type: "audio_chunk", data: base64Audio }));
                } catch (err) {
                    console.log("[REC] send chunk failed", err);
                }
            }
        };

        recorder.start(200);
        isRecording = true;
        faceImg.src = talkingSrc;

        console.log("[TALK] sending start_session");
        socket.send(JSON.stringify({ type: "start_session", user: currentUser || "guest" }));

        logStatus("[TALK] after start");
    } catch (err) {
        console.log("[REC] recorder creation failed", err);
        showError("Recorder failed.");
    }
}

// Replace your handler assignment:
function handleSocketMessage(evt) {
    console.log("[WS] message", { type: typeof evt.data });

    if (typeof evt.data === "string") {
        const msg = JSON.parse(evt.data);

        if (msg.type === "audio_response") {
            console.log("[WS] audio_response received");
            const binary = atob(msg.data);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            playAudio(bytes.buffer);
        }
        if (msg.type === "speech_start") faceImg.src = talkingSrc;
        if (msg.type === "speech_end") faceImg.src = waitingSrc;
        return;
    }

    console.log("[WS] binary audio received");
    playAudio(evt.data);
}


    // Attach many event listeners to debug click/tap
    function attachFaceDebugListeners(el) {
      const evs = [
        'pointerdown','pointerup','pointercancel','pointerleave',
        'mousedown','mouseup','click',
        'touchstart','touchend','touchcancel',
        'focus','blur','keydown','keyup'
      ];
      for (const ev of evs) {
        el.addEventListener(ev, (e) => {
          dbg('face event', ev, {
            type: e.type,
            pointerType: e.pointerType || (e.touches ? 'touch' : (e.changedTouches ? 'touch' : 'mouse')),
            altKey: e.altKey, ctrlKey: e.ctrlKey, metaKey: e.metaKey, shiftKey: e.shiftKey,
            timestamp: e.timeStamp
          });
          // visual cue for pointerdown
          if (ev === 'pointerdown' || ev === 'mousedown' || ev === 'touchstart') {
            el.classList.add('debug-highlight');
          }
          if (ev === 'pointerup' || ev === 'mouseup' || ev === 'touchend' || ev === 'pointercancel') {
            setTimeout(()=>el.classList.remove('debug-highlight'), 200);
          }
        }, {passive: false});
      }

      // Add keyboard activation (Enter/Space)
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          dbg('face key activation', e.key);
          e.preventDefault();
          toggleTalking();
        }
      });
    }

    attachFaceDebugListeners(companionFace);

    // Keep original click/touch handlers but log entry
    companionFace.addEventListener('click', (e) => {
      dbg('companionFace click handler invoked (user click)', {button: e.button});
      // call toggleTalking and stop propagation to see if something else swallows it
      toggleTalking();
    });

    // touchend alternative
    companionFace.addEventListener('touchend', (e) => {
      dbg('companionFace touchend handler invoked', {touches: e.touches?.length});
      e.preventDefault(); // prevent ghost mouse events on some devices
      toggleTalking();
    }, {passive: false});

    // sign out (no change except debug)
    document.getElementById("signOutButton").addEventListener("click", () => {
      dbg('signOut clicked');
      try { const u = pool.getCurrentUser(); if (u && typeof u.signOut === 'function') u.signOut(); } catch(e){ dbg('signOut error', e); }
      try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch(e){}
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      try { if (socket) socket.close(); } catch(e){}
      socket = null; idToken = null; currentUser = null;
      location.reload();
    });

    // cleanup on unload
    window.addEventListener('beforeunload', () => {
      dbg('beforeunload cleanup');
      try { audioCtx.close(); } catch(e){}
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      try { if (socket) socket.close(); } catch(e){}
    });

    // Quick status widget in debug console
    setInterval(() => {
      dbg('status', {
        audioState: audioCtx.state,
        socketState: socket ? socket.readyState : 'no-socket',
        isRecording,
        hasMedia: !!mediaStream,
        currentUser
      });
    }, 8000);
  </script>
</body>
